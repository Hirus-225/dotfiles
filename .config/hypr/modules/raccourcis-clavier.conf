###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, N, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, hyprctl kill
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, Return, exec, kitty --class floating_kitty

# Raccourci pour l'accès rapide 1Password (Super + Shift + Espace)
bind = SUPER SHIFT, Space, exec, bitwarden-desktop
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, B, exec, killall waybar && waybar & # Bouton d'urgence barre
bind = $mainMod, W, exec, waypaper
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh

# Utilise le style de ton launcher actuel pour le presse-papier
bind = $mainMod, H, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/launchers/type-2/style-1.rasi -p "History" | cliphist decode | wl-copy

# bind = $mainMod, Escape, exec, /home/zogoue_charles/.local/bin/powermenu.sh

# Toggle Fullscreen (Mode Focus)
bind = $mainMod, F, fullscreen, 0

# --- SECTION SCRATCHPAD (SUPER + S) ---
# Envoie la fenêtre active dans le tiroir caché
bind = $mainMod SHIFT, S, movetoworkspace, special
# Affiche/Cache le tiroir (toggle)
bind = $mainMod, S, togglespecialworkspace,

# Navigation (Focus)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Navigation (Workspaces)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Déplacer fenêtre vers un workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# Switch de workspace avec la molette (ou défilement trackpad + Cmd)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Plugins
#bind = $mainMod, E, hyprexpo:expo, toggle

#################################
###    SCREENSHOTS (SECURE)   ###
#################################

# Sélectionner une zone -> Presse-papier (Rapide & intuitif)
bind = SUPER, C, exec, grim -g "$(slurp)" - | wl-copy

# Tout l'écran -> Presse-papier
bind = SUPER SHIFT, C, exec, grim - | wl-copy

# Sélectionner une zone -> Enregistrer dans ~/Images (Archive)
bind = SUPER CONTROL, C, exec, grim -g "$(slurp)" ~/Images/$(date +'%Y-%m-%d_%Hh%Mm%Ss').png

# Verrouiller quand on ferme le capot
bindl=,switch:on:Lid Switch,exec,hyprlock
