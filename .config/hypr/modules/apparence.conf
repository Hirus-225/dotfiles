#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
# --- APPARENCE (Look "Glass" & Moderne) ---
general {
gaps_in = 6
gaps_out = 12
border_size = 2
col.active_border = $color1 $color2 45deg  # Utilise les couleurs de ton fond d'écran
col.inactive_border = rgba(595959aa)       # Gris discret pour les fenêtres inactives
layout = dwindle
resize_on_border = true     # Active le redimensionnement aux bords
extend_border_grab_area = 20 # Augmente la zone de clic autour du bord (en pixels)
hover_icon_on_border = true # Change le curseur quand tu es sur le bord
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
rounding = 12
    blur {
enabled = true
size = 6
passes = 2
new_optimizations = true
    }
    shadow {
enabled = true
range = 20
render_power = 3
color = rgba(00000044)
    }
}

# Blur sur les layers (waybar, rofi, etc.)
layerrule {
    name = waybar
    blur = true
}

layerrule {
    name = swaync-notification-window
    blur = true
}

layerrule {
    name = swaync-control-center
    blur = true
}

layerrule {
    name = gtklock
    blur = true
}
