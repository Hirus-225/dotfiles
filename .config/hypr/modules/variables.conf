#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# env = XCURSOR_THEME,Adwaita   # décommente pour figer le thème de curseur

# --- Wayland natif pour les applis (évite XWayland : flou HiDPI, pas de blur) ---
env = ELECTRON_OZONE_PLATFORM_HINT,auto        # Bitwarden, Obsidian (Electron)
env = MOZ_ENABLE_WAYLAND,1                      # Firefox
env = GDK_BACKEND,wayland,x11                   # apps GTK (fallback X11 si besoin)
env = QT_QPA_PLATFORM,wayland;xcb               # apps Qt (fallback xcb si besoin)
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1     # pas de barre de titre Qt en double
env = QT_AUTO_SCREEN_SCALE_FACTOR,1             # scaling Qt correct en HiDPI
