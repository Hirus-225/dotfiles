animations {
    enabled = yes

    # Courbes de Bézier personnalisées
    bezier = fluent_decel, 0, 1, 0, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softReturn, 0.1, 1, 0, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05     # léger rebond "spring"
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = borderRotate, 0.5, 0, 0.5, 1       # rotation du dégradé de bordure

    animation = windows, 1, 5, overshot, popin 85%
    animation = windowsOut, 1, 4, smoothOut, popin 85%
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, borderRotate, loop  # dégradé de bordure qui tourne
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, overshot, slidefade 15%
    animation = specialWorkspace, 1, 5, easeOutExpo, slidevert
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
