animations {
    enabled = yes

    # Courbes de Bézier personnalisées
    bezier = fluent_decel, 0, 1, 0, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softReturn, 0.1, 1, 0, 1

    animation = windows, 1, 3, fluent_decel, popin 80%
    animation = windowsOut, 1, 3, fluent_decel, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, easeOutExpo, slide
    animation = specialWorkspace, 1, 5, easeOutExpo, slidevert
}
