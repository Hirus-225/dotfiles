# --- INPUT & GESTURES (Version QWERTY Mac) ---
input {
    kb_layout = us
    kb_variant = mac
    kb_model = applealu6
    
    # Permet d'utiliser la touche Alt droite pour les accents
    kb_options = nodeadkeys 

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        disable_while_typing = yes
    }

    sensitivity = 0
    repeat_rate = 50
    repeat_delay = 300
}

device {
    name = casue-usb-kb
    kb_layout = fr
    kb_variant = azerty
    kb_model =
    kb_options =
}
