#################################
###      MEDIA CONTROLS       ###
#################################

# --- Volume (Style GNOME avec SwayOSD) ---
# Augmenter, Diminuer, Muet
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# --- Luminosité écran (Spécifique MacBook Air) ---
# Utilise désormais SwayOSD pour le retour visuel
bindel = , XF86MonBrightnessUp, exec, swayosd-client --device intel_backlight --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --device intel_backlight --brightness lower

# --- Rétroéclairage du clavier (F5 et F6) ---
# brightnessctl pilote la LED smc::kbd_backlight ; le script affiche l'OSD SwayOSD.
bindel = , XF86KbdBrightnessUp, exec, ~/.config/hypr/scripts/kbd_backlight.sh up
bindel = , XF86KbdBrightnessDown, exec, ~/.config/hypr/scripts/kbd_backlight.sh down

# --- Contrôles Media (F7, F8, F9) ---
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
