# Import des couleurs pywal
source = ~/.cache/wal/colors-hyprland.conf

# ─── BACKGROUND ───────────────────────────────────────────
background {
    monitor =
    path = /home/zogoue_charles/.cache/wal/current_wallpaper.png
    blur_passes = 
    blur_size = 7
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ─── HEURE ────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.4)
    position = 0, 220
    halign = center
    valign = center
}

# ─── DATE ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B %Y"  # Ex: "mercredi 11 juin 2025"
    color = alpha($foreground, 0.75)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0,0,0,0.3)
    position = 0, 150
    halign = center
    valign = center
}

# ─── MESSAGE DE BIENVENUE ──────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] ~/.config/hypr/scripts/greeting.sh
    color = $color4
    font_size = 14
    font_family = JetBrainsMono Nerd Font Italic
    position = 0, 95
    halign = center
    valign = center
}

# ─── CHAMP MOT DE PASSE ───────────────────────────────────
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.3        # Plus visible qu'avant
    dots_spacing = 0.25
    dots_center = true
    rounding = 12          # Coins arrondis style "bulle"
    outer_color = $color4
    inner_color = alpha($color0, 0.7)
    font_color = $foreground
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##cdd6f4"><i>  Mot de passe</i></span>

    # Feedback visuel sur erreur/succès
    check_color = $color2
    fail_color = $color1
    fail_text = <i>$ATTEMPTS tentative(s) incorrecte(s)</i>
    fail_timeout = 2000

    position = 0, -20
    halign = center
    valign = center
}
